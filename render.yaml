services:
  - type: web
    name: cloud-healthcare-platform
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt && cd ../infra && python seed_dev.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: prod
      - key: FILE_STORAGE
        value: local
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://cmep-frontend.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.0
